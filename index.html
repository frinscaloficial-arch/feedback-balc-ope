<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Satisfação - Frinscal</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #3E4A9B;
            --tag-selected: #3E4A9B;
            --border-color: #D1D5DB;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--primary-blue);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header-text {
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }

        .header-text h1 { font-size: 1.8rem; margin: 0; line-height: 1.2; }

        .card {
            background: white;
            border-radius: 40px;
            padding: 30px;
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* Estilo para o campo Código do Cliente */
        .input-group {
            margin-bottom: 25px;
            text-align: left;
            max-width: 90%;
            margin-left: auto;
            margin-right: auto;
        }

        .input-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.95rem;
        }

        .input-field {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .input-field:focus {
            border-color: var(--primary-blue);
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        /* NPS e Tags (Mantidos do anterior) */
        .nps-container { display: flex; justify-content: space-between; gap: 4px; margin-bottom: 25px; flex-wrap: wrap; }
        .nps-item { position: relative; flex: 1; min-width: 30px; }
        .nps-item input { position: absolute; opacity: 0; cursor: pointer; }
        .nps-label {
            display: flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 50%; color: white;
            font-weight: bold; cursor: pointer; transition: transform 0.2s; margin: 0 auto; font-size: 0.9rem;
        }

        .n-0, .n-1, .n-2 { background-color: #E74C3C; }
        .n-3, .n-4, .n-5 { background-color: #E67E22; }
        .n-6, .n-7, .n-8 { background-color: #F1C40F; }
        .n-9, .n-10 { background-color: #2ECC71; }

        .nps-item input:checked + .nps-label { transform: scale(1.25); box-shadow: 0 0 0 3px #333; }

        .section-title { font-size: 1rem; margin: 20px 0 10px; }
        .tags-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 15px; }
        .tag-item input { display: none; }
        .tag-label {
            display: inline-block; padding: 6px 15px; border: 1px solid var(--border-color);
            border-radius: 20px; font-size: 0.85rem; color: #7F8C8D; cursor: pointer; transition: all 0.2s;
        }
        .tag-item input:checked + .tag-label { background-color: var(--tag-selected); color: white; border-color: var(--tag-selected); }

        .logo { margin-top: 25px; max-width: 150px; }
        
        button {
            margin-top: 20px; padding: 12px 40px; background-color: #2ECC71;
            color: white; border: none; border-radius: 25px; font-weight: bold;
            cursor: pointer; font-size: 1rem; transition: background 0.3s;
        }
        button:hover { background-color: #27ae60; }
        #statusMsg { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-text">
        <h1>Sua opinião é<br>importante para nós!</h1>
    </div>

    <div class="card">
        <form id="feedbackForm">
            <div class="input-group">
                <label for="codigo_cliente">Código do Cliente</label>
                <input type="text" id="codigo_cliente" name="codigo_cliente" class="input-field" placeholder="Ex: 12345" required>
            </div>

            <div class="question-title">Como você avalia nosso atendimento de 0 a 10?</div>
            
            <div class="nps-container">
                <script>
                    for(let i=0; i<=10; i++){
                        let colorClass = i <= 2 ? 'n-0' : i <= 5 ? 'n-3' : i <= 8 ? 'n-6' : 'n-9';
                        document.write(`
                            <div class="nps-item">
                                <input type="radio" name="nota" value="${i}" id="n${i}" required>
                                <label for="n${i}" class="nps-label ${colorClass}">${i}</label>
                            </div>
                        `);
                    }
                </script>
            </div>

            <div class="section-title">Pontos <b>Positivos</b></div>
            <div class="tags-container">
                <label class="tag-item"><input type="checkbox" name="positivos" value="Pagamento"><span class="tag-label">Pagamento</span></label>
                <label class="tag-item"><input type="checkbox" name="positivos" value="Recebimento"><span class="tag-label">Recebimento</span></label>
                <label class="tag-item"><input type="checkbox" name="positivos" value="Qualidade"><span class="tag-label">Qualidade</span></label>
                <label class="tag-item"><input type="checkbox" name="positivos" value="Atendimento"><span class="tag-label">Atendimento</span></label>
                <label class="tag-item"><input type="checkbox" name="positivos" value="Ambiente"><span class="tag-label">Ambiente</span></label>
            </div>

            <div class="section-title">Pontos <b>Negativos</b></div>
            <div class="tags-container">
                <label class="tag-item"><input type="checkbox" name="negativos" value="Pagamento"><span class="tag-label">Pagamento</span></label>
                <label class="tag-item"><input type="checkbox" name="negativos" value="Recebimento"><span class="tag-label">Recebimento</span></label>
                <label class="tag-item"><input type="checkbox" name="negativos" value="Qualidade"><span class="tag-label">Qualidade</span></label>
                <label class="tag-item"><input type="checkbox" name="negativos" value="Atendimento"><span class="tag-label">Atendimento</span></label>
                <label class="tag-item"><input type="checkbox" name="negativos" value="Ambiente"><span class="tag-label">Ambiente</span></label>
            </div>

            <button type="submit" id="btnEnviar">Enviar Pesquisa</button>
            <div id="statusMsg"></div>
        </form>
    </div>

    <img src="https://frinscaldistribuidora.agilecdn.com.br/imgs/frinscal-logo-1682131837.png" alt="Logo Frinscal" class="logo">

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzW7zLYfRXBg_rWCbC6QLUFuBag4Tz5SPhsaP0_dWXuImj_wkdUE2rPQDQTNfIDEUw/exec';
        const form = document.getElementById('feedbackForm');

        form.addEventListener('submit', e => {
            e.preventDefault();
            document.getElementById('btnEnviar').disabled = true;
            document.getElementById('btnEnviar').innerText = "Enviando...";

            const formData = new FormData(form);
            
            fetch(scriptURL, { method: 'POST', body: formData})
                .then(response => {
                    document.getElementById('statusMsg').innerHTML = "✅ Feedback enviado com sucesso!";
                    document.getElementById('statusMsg').style.color = "green";
                    form.reset();
                    document.getElementById('btnEnviar').disabled = false;
                    document.getElementById('btnEnviar').innerText = "Enviar Pesquisa";
                })
                .catch(error => {
                    document.getElementById('statusMsg').innerHTML = "❌ Erro ao enviar.";
                    document.getElementById('statusMsg').style.color = "red";
                    document.getElementById('btnEnviar').disabled = false;
                });
        });
    </script>
</body>
</html>
