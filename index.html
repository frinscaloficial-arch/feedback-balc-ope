<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Satisfação</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .rating-group {
            display: flex;
            justify-content: space-between;
            flex-direction: row-reverse;
            padding: 10px 0;
        }

        .rating-group input { display: none; }

        .rating-group label {
            cursor: pointer;
            font-size: 30px;
            color: #ddd;
            transition: color 0.2s;
        }

        .rating-group input:checked ~ label,
        .rating-group label:hover,
        .rating-group label:hover ~ label {
            color: #ffca08;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #357ABD;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Pesquisa de Satisfação</h2>
    <form id="satisfactionForm">
        <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" required>
        </div>

        <div class="form-group">
            <label>Como você avalia nosso serviço?</label>
            <div class="rating-group">
                <input type="radio" name="nota" value="5" id="star5"><label for="star5">★</label>
                <input type="radio" name="nota" value="4" id="star4"><label for="star4">★</label>
                <input type="radio" name="nota" value="3" id="star3"><label for="star3">★</label>
                <input type="radio" name="nota" value="2" id="star2"><label for="star2">★</label>
                <input type="radio" name="nota" value="1" id="star1"><label for="star1">★</label>
            </div>
        </div>

        <div class="form-group">
            <label for="comentario">Comentários Adicionais</label>
            <textarea id="comentario" name="comentario" rows="4"></textarea>
        </div>

        <button type="submit" id="submitBtn">Enviar Feedback</button>
    </form>
    <div id="message"></div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzW7zLYfRXBg_rWCbC6QLUFuBag4Tz5SPhsaP0_dWXuImj_wkdUE2rPQDQTNfIDEUw/exec';
    const form = document.getElementById('satisfactionForm');
    const msg = document.getElementById('message');

    form.addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').innerText = "Enviando...";

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                msg.style.display = "block";
                msg.innerText = "Obrigado! Seu feedback foi enviado.";
                msg.style.color = "green";
                form.reset();
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('submitBtn').innerText = "Enviar Feedback";
            })
            .catch(error => {
                msg.style.display = "block";
                msg.innerText = "Erro ao enviar. Tente novamente.";
                msg.style.color = "red";
                console.error('Error!', error.message);
            });
    });
</script>

</body>
</html>
