<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Satisfação - Frinscal - PE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #3D4392;
            --btn-green: #40D380;
            --tag-selected: #3D4392;
            --border-light: #D1D5DB;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--primary-blue);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            padding: 20px;
            box-sizing: border-box;
        }

        .container { width: 100%; max-width: 550px; text-align: center; }
        
        .step { display: none; flex-direction: column; align-items: center; width: 100%; }
        .step.active { display: flex; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1 { font-weight: 800; font-size: 2.2rem; margin-bottom: 40px; line-height: 1.1; }

        .card {
            background: white;
            border-radius: 60px;
            padding: 40px 30px;
            width: 100%;
            color: #333;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }

        .question { font-size: 1.1rem; font-weight: 600; margin-bottom: 25px; }
        .nps-container { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 30px; }
        .nps-item input { display: none; }
        .nps-label {
            display: flex; align-items: center; justify-content: center;
            width: 35px; height: 35px; border-radius: 50%; color: white;
            font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem;
        }
        .n-0, .n-1, .n-2 { background-color: #E74C3C; }
        .n-3, .n-4, .n-5 { background-color: #E67E22; }
        .n-6, .n-7, .n-8 { background-color: #F1C40F; }
        .n-9, .n-10 { background-color: #2ECC71; }
        .nps-item input:checked + .nps-label { transform: scale(1.3); box-shadow: 0 0 0 3px #333; }

        .tag-section { margin: 20px 0; }
        .tag-title { font-size: 1.1rem; margin-bottom: 12px; }
        .tag-title b { color: var(--primary-blue); }
        .tags-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
        .tag-item input { display: none; }
        .tag-label {
            padding: 8px 18px; border: 1px solid var(--border-light);
            border-radius: 25px; font-size: 0.9rem; color: #7F8C8D; cursor: pointer;
            display: block;
        }
        .tag-item input:checked + .tag-label { background: var(--tag-selected); color: white; border-color: var(--tag-selected); }

        .icon-check { width: 100px; height: 100px; background: #2ECC71; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; }
        .icon-check::after { content: '✓'; color: white; font-size: 60px; }
        .success-text { font-size: 1.1rem; line-height: 1.5; color: #444; }
        .timer-text { margin-top: 30px; font-size: 1.1rem; font-weight: 400; }

        .btn {
            background-color: var(--btn-green);
            color: white; border: none; border-radius: 40px;
            padding: 15px 50px; font-size: 1.5rem; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; gap: 15px;
            margin-top: 30px; transition: 0.3s; text-transform: uppercase;
        }
        .btn-enviar { margin: 30px auto 0; font-size: 1.2rem; }
        .logo { margin-top: 50px; width: 180px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="step1" class="step active">
            <h1>Sua opinião é<br>importante para nós!</h1>
            <div class="card">
                <form id="feedbackForm">
                    <div class="question">Como você avalia nosso atendimento de 0 a 10?</div>
                    <div class="nps-container">
                        <script>
                            for(let i=0; i<=10; i++){
                                let c = i<=2 ? 'n-0' : i<=5 ? 'n-3' : i<=8 ? 'n-6' : 'n-9';
                                document.write(`<label class="nps-item"><input type="radio" name="nota" value="${i}" required><span class="nps-label ${c}">${i}</span></label>`);
                            }
                        </script>
                    </div>

                    <div class="tag-section">
                        <div class="tag-title">Pontos <b>Positivos</b></div>
                        <div class="tags-grid" id="pos-grid"></div>
                    </div>

                    <div class="tag-section">
                        <div class="tag-title">Pontos <b>Negativos</b></div>
                        <div class="tags-grid" id="neg-grid"></div>
                    </div>
                </form>
            </div>
            <button class="btn btn-enviar" onclick="enviarDados()">Enviar Avaliação</button>
        </div>

        <div id="step2" class="step">
            <h1 style="font-size: 1.8rem;">Muito obrigado!</h1>
            <div class="card">
                <div class="icon-check"></div>
                <p class="success-text">Sua opinião ajuda a melhorar nosso serviço continuamente.</p>
            </div>
            <div class="timer-text">Reiniciando em: <b id="timer">10</b>s</div>
        </div>

        <img src="g15.png" class="logo" alt="Logo">
    </div>

    <script>
        // ATENÇÃO: Substitua pelo seu link de implantação atualizado!
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzW7zLYfRXBg_rWCbC6QLUFuBag4Tz5SPhsaP0_dWXuImj_wkdUE2rPQDQTNfIDEUw/exec'; 
        const tags = ["Pagamento", "Recebimento", "Qualidade", "Atendimento", "Ambiente"];
        
        // Gerar Tags
        ['pos-grid', 'neg-grid'].forEach(id => {
            const container = document.getElementById(id);
            const prefix = id.split('-')[0];
            tags.forEach(t => {
                container.innerHTML += `<label class="tag-item"><input type="checkbox" name="${prefix}" value="${t}"><span class="tag-label">${t}</span></label>`;
            });
        });

        function nextStep(step) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
        }

        function enviarDados() {
            const form = document.getElementById('feedbackForm');
            const nota = form.querySelector('input[name="nota"]:checked');
            
            if(!nota) { alert("Por favor, selecione uma nota."); return; }

            const btn = document.querySelector('.btn-enviar');
            btn.innerText = "Enviando...";
            btn.disabled = true;

            const positivos = Array.from(form.querySelectorAll('input[name="pos"]:checked')).map(i => i.value).join(", ");
            const negativos = Array.from(form.querySelectorAll('input[name="neg"]:checked')).map(i => i.value).join(", ");

            // CORREÇÃO: Usar URLSearchParams para compatibilidade total com e.parameter
            const params = new URLSearchParams();
            params.append("pedido", "Não informado");
            params.append("nota", nota.value);
            params.append("positivos", positivos);
            params.append("negativos", negativos);

            fetch(scriptURL, { 
                method: 'POST', 
                body: params,
                mode: 'no-cors' // Crucial para o Google Apps Script
            })
            .then(() => {
                nextStep(2);
                startTimer();
            })
            .catch(() => {
                alert("Erro de conexão. Tente novamente.");
                btn.innerText = "Enviar Avaliação";
                btn.disabled = false;
            });
        }

        function startTimer() {
            let timeLeft = 10;
            const timerEl = document.getElementById('timer');
            const interval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(interval);
                    window.location.reload();
                }
            }, 1000);
        }
    </script>
</body>
</html>
